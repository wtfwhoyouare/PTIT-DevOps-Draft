; ============================================================
;  Cau hinh CO Y de lo cho lab dao tao SQLi
;  display_errors=On -> loi SQL/PHP hien ra front-end
;  => phuc vu ky thuat Error-based SQL Injection
; ============================================================
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = Off

; Session mac dinh (giong app that: cookie PHPSESSID)
session.cookie_httponly = Off
